<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NashNumber</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%231A1208'/><text x='50%25' y='54%25' dominant-baseline='middle' text-anchor='middle' font-family='Georgia,serif' font-weight='700' font-size='38' fill='%23C8963E'>1</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --dark: #1A1208;
    --gold: #C8963E;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
    overflow-y: auto;
  }

  * { -webkit-tap-highlight-color: transparent; }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.6;
  }

  header {
    text-align: center;
    padding: 48px 24px 24px;
    width: 100%;
  }

  header h1 {
    font-family: 'Lora', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--gold);
    letter-spacing: 0.04em;
    line-height: 1.1;
  }

  header p {
    color: #9A8E76;
    margin-top: 8px;
    font-size: 0.95rem;
    letter-spacing: 0.06em;
  }

  /* Key selector */
  .key-selector {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    padding: 20px 24px;
    max-width: 600px;
  }

  .key-selector label {
    color: #9A8E76;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    width: 100%;
    text-align: center;
    margin-bottom: 4px;
  }

  .key-btn {
    background: transparent;
    border: 1px solid #3A3020;
    color: #9A8E76;
    padding: 6px 14px;
    border-radius: 2px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.03em;
  }

  .key-btn:hover { border-color: var(--gold); color: var(--gold); }
  .key-btn.active { background: var(--gold); border-color: var(--gold); color: var(--dark); font-weight: 700; }

  /* Card deck area */
  .deck-area {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    width: 100%;
    max-width: 700px;
  }

  .nav-btn {
    background: transparent;
    border: 1px solid #3A3020;
    color: #9A8E76;
    width: 44px;
    height: 44px;
    border-radius: 2px;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* THE CARD */
  .card-container {
    width: min(380px, 90vw);
    height: 480px;
    cursor: pointer;
    flex-shrink: 0;
    flex-grow: 0;
    align-self: center;
    user-select: none;
    -webkit-user-select: none;
    position: relative;
  }

  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 4px;
    overflow: hidden;
    border: 1px solid #3A3020;
    transition: opacity 0.35s ease, transform 0.35s ease;
  }

  /* Front visible by default */
  .card-front {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
    z-index: 2;
  }
  .card-back {
    opacity: 0;
    transform: scale(0.97);
    pointer-events: none;
    z-index: 1;
  }

  /* Flipped state */
  .card-inner.flipped .card-front {
    opacity: 0;
    transform: scale(0.97);
    pointer-events: none;
  }
  .card-inner.flipped .card-back {
    opacity: 1;
    transform: scale(1);
    pointer-events: auto;
  }

  /* Front of card */
  .card-front {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .card-accent-line {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 4px;
  }

  .card-number-big {
    font-family: 'Lora', serif;
    font-size: 9rem;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -0.02em;
    opacity: 0.95;
  }

  .card-number-name {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1.2rem;
    margin-top: 8px;
    opacity: 0.9;
  }

  .card-emoji {
    font-size: 3.5rem;
    margin: 20px 0 12px;
    filter: drop-shadow(0 4px 12px rgba(0,0,0,0.4));
  }

  .card-feeling {
    font-size: 0.9rem;
    font-weight: 500;
    letter-spacing: 0.05em;
    opacity: 0.9;
    text-align: center;
    max-width: 260px;
    line-height: 1.7;
  }

  .card-key-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
  }

  .card-flip-hint {
    position: absolute;
    bottom: 16px;
    font-size: 0.65rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.5;
  }

  /* Back of card */
  .card-back {
    display: flex;
    flex-direction: column;
    padding: 28px;
    overflow: hidden;
  }

  .back-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding-bottom: 10px;
  }

  .back-number-small {
    font-family: 'Lora', serif;
    font-size: 2.8rem;
    font-weight: 700;
    line-height: 1;
  }

  .back-chord-name {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 1rem;
    opacity: 0.7;
    margin-top: 4px;
  }

  .back-key-chord {
    text-align: right;
  }

  .back-key-label {
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 1;
    margin-bottom: 4px;
    color: var(--gold);
  }

  .back-chord {
    font-family: 'Lora', serif;
    font-size: 2rem;
    font-weight: 700;
  }

  .back-section {
    margin-bottom: 9px;
  }

  .back-section-label {
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    opacity: 0.7;
    color: var(--gold);
    margin-bottom: 3px;
    font-weight: 600;
  }

  .back-section-content {
    font-size: 0.88rem;
    line-height: 1.5;
    opacity: 0.92;
    font-weight: 400;
  }

  .notes-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .note-pill {
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 2px;
    padding: 3px 10px;
    font-size: 0.8rem;
    letter-spacing: 0.05em;
  }

  .song-examples {
    font-style: italic;
    font-family: 'Lora', serif;
    font-size: 0.85rem;
    line-height: 1.5;
    opacity: 0.7;
  }

  /* Progress */
  .progress-area {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 24px;
  }

  .progress-count {
    color: #9A8E76;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    min-width: 60px;
    text-align: center;
  }

  .progress-dots {
    display: flex;
    gap: 6px;
  }

  .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #3A3020;
    transition: background 0.3s;
    cursor: pointer;
  }

  .dot.active { background: var(--gold); }
  .dot.visited { background: #6A5A3A; }

  /* Mode selector */
  .mode-bar {
    display: flex;
    gap: 12px;
    padding: 0 24px 24px;
  }

  .mode-btn {
    background: transparent;
    border: 1px solid #3A3020;
    color: #9A8E76;
    padding: 6px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .mode-btn:hover { border-color: var(--gold); color: var(--gold); }
  .mode-btn.active { background: #2A1F0A; border-color: var(--gold); color: var(--gold); }

  /* Nashville staff decoration */
  .staff-decoration {
    width: 100%;
    max-width: 600px;
    height: 40px;
    margin: 8px 0;
    opacity: 0.12;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    padding: 0 40px;
  }

  .staff-line {
    flex: 1;
    height: 1px;
    background: var(--gold);
    position: relative;
  }

  .staff-note {
    color: var(--gold);
    font-size: 1.4rem;
    margin: 0 6px;
  }

  footer {
    color: #9A8A6A;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 24px;
    text-align: center;
  }

  /* Animations */
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-container { animation: cardIn 0.4s ease; }

  .card-inner.shake {
    animation: shake 0.3s ease;
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>

<header>
  <h1>NashNumber</h1>
  <p>Learn the Nashville Number System</p>
</header>

<div class="staff-decoration">
  <div class="staff-line"></div>
  <span class="staff-note">♩</span>
  <div class="staff-line"></div>
  <span class="staff-note">♪</span>
  <div class="staff-line"></div>
  <span class="staff-note">♩</span>
  <div class="staff-line"></div>
  <span class="staff-note">♫</span>
  <div class="staff-line"></div>
</div>

<div class="key-selector">
  <label>Choose a Key</label>
  <div id="keyBtns"></div>
  <button class="key-btn" id="randomKeyBtn" onclick="randomKey()" style="margin-top:6px;border-color:#6A5A3A;letter-spacing:0.08em;">⚄ Random</button>
</div>

<div class="mode-bar">
  <button class="mode-btn active" onclick="setMode('study')" id="modeStudy">Study</button>
  <button class="mode-btn" onclick="setMode('shuffle')" id="modeShuffle">Shuffle</button>
  <button class="mode-btn" onclick="setMode('quiz')" id="modeQuiz">Quiz</button>
  <button class="mode-btn" id="soundToggle" onclick="toggleSound()" style="margin-left:8px;border-color:#3A3020;">🔇 Sound</button>
</div>

<div id="soundControls" style="display:none;flex-wrap:wrap;justify-content:center;align-items:center;gap:10px;padding:0 24px 12px;">
  <div style="display:flex;align-items:center;gap:8px;">
    <span style="font-size:0.72rem;color:#6A5A3A;letter-spacing:0.05em;">VOL</span>
    <input type="range" min="0.1" max="1" step="0.05" value="0.75"
      oninput="setVolume(this.value)"
      style="width:80px;accent-color:var(--gold);cursor:pointer;">
    <span id="volLabel" style="font-size:0.72rem;color:#9A8E76;min-width:32px;">75%</span>
  </div>
</div>

<div id="modeDesc" style="font-size:0.78rem;letter-spacing:0.08em;text-transform:uppercase;color:#9A8A6A;padding:0 24px 12px;text-align:center;"></div>

<!-- Quiz answer buttons -->
<div id="quizBtns" style="display:none;flex-wrap:wrap;justify-content:center;gap:8px;padding:0 24px 16px;max-width:500px;"></div>

<!-- Score overlay -->
<div id="scoreOverlay" style="display:none;position:fixed;inset:0;background:rgba(10,8,4,0.92);z-index:200;align-items:center;justify-content:center;"></div>

<div class="deck-area">
  <button class="nav-btn" onclick="prevCard()">←</button>
  <div class="card-container" id="cardContainer" onclick="flipCard(event)" tabindex="-1" style="outline:none;">
    <div class="card-inner" id="cardInner">
      <div class="card-face card-front" id="cardFront"></div>
      <div class="card-face card-back" id="cardBack"></div>
    </div>
  </div>
  <button class="nav-btn" onclick="nextCard()">→</button>
</div>

<div class="progress-area">
  <span class="progress-count" id="progressCount"></span>
  <div class="progress-dots" id="progressDots"></div>
  <span id="quizTimer" style="font-size:0.78rem;color:#9A8A6A;min-width:40px;text-align:right;display:none;"></span>
</div>

<div class="staff-decoration">
  <div class="staff-line"></div>
  <span class="staff-note">𝄇</span>
  <div class="staff-line"></div>
</div>

<footer>tap card to reveal · arrows to navigate · choose key above</footer>

<script>
const KEYS = ['C','G','D','A','E','B','F','Bb','Eb','Ab','Db'];
const SCALE_STEPS = [0,2,4,5,7,9,11];

function getScaleNotes(key) {
  const roots = { C:0,G:7,D:2,A:9,E:4,B:11,F:5,Bb:10,Eb:3,Ab:8,Db:1 };
  const root = roots[key];
  return SCALE_STEPS.map(s => {
    const noteIdx = (root + s) % 12;
    const names = ['C','C#/Db','D','Eb','E','F','F#/Gb','G','Ab','A','Bb','B'];
    return names[noteIdx];
  });
}

const NUMBERS = [
  { num:'1', solfege:'Do',  name:'The Tonic',      roman:'I',   quality:'Major',             color:'#C8963E', bgColor:'#1C1508', accentColor:'#C8963E', emoji:'🏠', feeling:'Home · Stability · Resolution · Arrival',          description:'The home base. Every song begins or ends here. It\'s the "answer" — the place everything resolves to. A feeling of complete rest.',                                                                          songs:'"Take Me Home, Country Roads" (W. Denver) — the 1 is where you exhale.',           function:'Tonic — establishes the key center' },
  { num:'2', solfege:'Re',  name:'The Supertonic',  roman:'II',  quality:'Minor',             color:'#6B8A7A', bgColor:'#080F0C', accentColor:'#4A8A6A', emoji:'🌊', feeling:'Gentle tension · Wistfulness · Movement beginning',  description:'Rarely the star, but essential in motion. The 2m creates a mild pull toward the 5. Often used in ii–V–I jazz movement. Melancholic and searching.',                                                          songs:'The "Dm" in C major — the 2 chord in countless country ballads adds a soft ache.', function:'Predominant — leads smoothly toward the 5' },
  { num:'3', solfege:'Mi',  name:'The Mediant',     roman:'III', quality:'Minor',             color:'#7A6B8A', bgColor:'#0C0A10', accentColor:'#7A5A9A', emoji:'🌙', feeling:'Dreamlike · Color · Surprise · Bittersweet',         description:'The mysterious middle child. Shares two notes with the 1 chord, giving it a chameleon quality — it can substitute for the 1 or create unexpected color. Moody and evocative.',                                songs:'Bridges and interludes often land on the 3m for emotional depth — "Crazy" (W. Nelson).', function:'Tonic substitute — shares notes with the 1 chord' },
  { num:'4', solfege:'Fa',  name:'The Subdominant', roman:'IV',  quality:'Major',             color:'#4A8A4A', bgColor:'#060F06', accentColor:'#5A9A5A', emoji:'🌿', feeling:'Lift · Openness · Yearning · Hymn-like warmth',      description:'The great uplifter. When you move from 1 to 4, you feel the world open up. Gospel, country, rock — the 4 chord is the universal chord of reaching skyward. Warm and expansive.',                              songs:'"Amazing Grace," every chorus that opens up — the 1–4 move is sacred.',             function:'Subdominant — motion away from home' },
  { num:'5', solfege:'Sol', name:'The Dominant',    roman:'V',   quality:'Major',             color:'#8A3A2A', bgColor:'#0F0805', accentColor:'#C04A30', emoji:'⚡', feeling:'Tension · Anticipation · Drive · Need to resolve',   description:'The engine of music. The 5 chord creates irresistible pull back to the 1. It\'s the cliffhanger, the held breath, the question mark. Nothing sounds more unfinished than stopping on the 5.',                songs:'"Stand By Your Man" (T. Wynette) — that 5 chord pulls you home every time.',        function:'Dominant — creates tension that resolves to the 1' },
  { num:'6', solfege:'La',  name:'The Submediant',  roman:'VI',  quality:'Minor',             color:'#3D6A8A', bgColor:'#060C10', accentColor:'#3A7AAA', emoji:'🌧️', feeling:'Longing · Melancholy · Depth · Emotional resonance', description:'The heartache chord. The 6m is the relative minor of the key — it shares DNA with the 1 but tilts everything into shadow. This is where country music lives emotionally. Deeply felt.',                   songs:'"He Stopped Loving Her Today" (G. Jones) — the 6m is sorrow made sound.',           function:'Tonic substitute / relative minor — emotional depth' },
  { num:'7', solfege:'Ti',  name:'The Leading Tone',roman:'VII', quality:'Diminished / Major*',color:'#8A7A2A', bgColor:'#0F0E05', accentColor:'#AA9A3A', emoji:'🌅', feeling:'Quirky · Passing · Unresolved · Bluesy grit',       description:'The wildcard. In Nashville, the flat-7 (♭VII major) is common — borrowed from the mixolydian mode. It sounds rootsy, Americana, slightly unresolved. Adds grit and character.',                              songs:'"With a Little Help from My Friends" — the ♭VII gives that earthy, rebellious feel.', function:'♭VII = bluesy color; natural VII° = leading tension' }
];

const MODE_INFO = {
  study:   '1 → 7 in order · tap to flip · learn the feel of each',
  quiz:    'Alternate: guess the chord letter, then the number · scored',
  shuffle: 'Cards in random order · arrows to navigate · tap to flip'
};

let currentKey = 'G';
let currentIdx = 0;
let isFlipped = false;
let mode = 'study';
let visited = new Set([0]);
let deck = [...NUMBERS]; // may be shuffled
let quizAnswered = false;
let quizStartTime = null;
let quizTimerInterval = null;

// ── Mode switching ────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('mode' + m.charAt(0).toUpperCase() + m.slice(1)).classList.add('active');
  document.getElementById('modeDesc').textContent = MODE_INFO[m];

  if (m === 'quiz') {
    quizScore = 0;
    quizTotal = 0;
    // 14 questions: 2 shuffled passes through all 7 numbers
    const r1 = [...NUMBERS].sort(() => Math.random() - 0.5);
    const r2 = [...NUMBERS].sort(() => Math.random() - 0.5);
    deck = [...r1, ...r2];
    // Start timer
    quizStartTime = Date.now();
    clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(updateTimerDisplay, 1000);
  } else if (m === 'shuffle') {
    clearInterval(quizTimerInterval);
    deck = [...NUMBERS].sort(() => Math.random() - 0.5);  } else {
    clearInterval(quizTimerInterval);
    deck = [...NUMBERS];
  }

  // Show/hide nav arrows based on mode
  document.querySelectorAll('.nav-btn').forEach(b => {
    b.style.visibility = m === 'quiz' ? 'hidden' : 'visible';
  });

  currentIdx = 0;
  visited = new Set([0]);
  isFlipped = false;
  quizAnswered = false;
  // Show timer only in quiz mode
  const timerEl = document.getElementById('quizTimer');
  if (timerEl) timerEl.style.display = m === 'quiz' ? 'inline' : 'none';
  renderCard();
  renderDots();
  renderQuizBtns();
}

// ── Key buttons ───────────────────────────────────────────────
function initKeyBtns() {
  const c = document.getElementById('keyBtns');
  c.style.cssText = 'display:flex;flex-wrap:wrap;justify-content:center;gap:8px;';
  KEYS.forEach(k => {
    const b = document.createElement('button');
    b.className = 'key-btn' + (k === currentKey ? ' active' : '');
    b.textContent = k;
    b.onclick = () => {
      currentKey = k;
      document.querySelectorAll('.key-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      isFlipped = false;
      quizAnswered = false;
      renderCard();
      renderQuizBtns();
    };
    c.appendChild(b);
  });
}

// ── Quiz state ────────────────────────────────────────────────
let quizChoices = [];
let quizScore = 0;
let quizTotal = 0;
let quizType = 'number'; // 'number' = show chord, guess number | 'letter' = show number, guess chord

function getChordLabel(card, notes) {
  const note = notes[parseInt(card.num) - 1];
  const suffix = card.quality.includes('Minor') ? 'm' : card.quality.includes('Dim') ? '°' : '';
  return note + suffix;
}

// ── Quiz buttons ──────────────────────────────────────────────
function renderQuizBtns() {
  const wrap = document.getElementById('quizBtns');
  if (mode !== 'quiz') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = '';
  quizAnswered = false;

  const correctCard = deck[currentIdx];
  const notes = getScaleNotes(currentKey);

  const others = NUMBERS.filter(n => n.num !== correctCard.num);
  const distractors = others.sort(() => Math.random() - 0.5).slice(0, 3);
  const choices = [...distractors, correctCard].sort(() => Math.random() - 0.5);
  quizChoices = choices;

  choices.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'key-btn';
    b.style.cssText = 'font-size:1.1rem;padding:8px 20px;position:relative;min-width:56px;font-family:"DM Sans",sans-serif;';
    b.dataset.num = c.num;

    // Label depends on question type
    const label = quizType === 'letter' ? getChordLabel(c, notes) : c.num;
    b.innerHTML = `<span style="position:absolute;top:3px;left:6px;font-size:0.55rem;opacity:0.45;">${i+1}</span>${label}`;
    b.onclick = () => submitQuizAnswer(c.num);
    wrap.appendChild(b);
  });

  updateFlipHint();
}

function updateFlipHint() {
  if (mode !== 'quiz') return;
  const hint = document.querySelector('.card-flip-hint');
  if (!hint) return;
  hint.textContent = quizAnswered ? 'space → next question' : 'press 1–4 to answer';
}

function submitQuizAnswer(chosenNum) {
  if (quizAnswered) return;
  quizAnswered = true;
  quizTotal++;

  const correctCard = deck[currentIdx];
  const isCorrect = chosenNum === correctCard.num;
  if (isCorrect) quizScore++;

  const wrap = document.getElementById('quizBtns');
  wrap.querySelectorAll('button').forEach(btn => {
    if (btn.dataset.num === correctCard.num) {
      btn.style.background = '#1A3A0A';
      btn.style.borderColor = '#5A9A3A';
      btn.style.color = '#9ADA6A';
    } else if (btn.dataset.num === chosenNum) {
      btn.style.background = '#3A0A0A';
      btn.style.borderColor = '#9A3A3A';
      btn.style.color = '#DA6A6A';
    } else {
      btn.style.opacity = '0.3';
    }
  });

  setTimeout(() => {
    isFlipped = true;
    document.getElementById('cardInner').classList.add('flipped');
    updateFlipHint();
    const card = deck[currentIdx];
    const notes = getScaleNotes(currentKey);
    const chordNote = notes[parseInt(card.num) - 1];
    playChord(chordNote, card.quality);
  }, 400);
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return m > 0 ? `${m}m ${sec}s` : `${sec}s`;
}

function updateTimerDisplay() {
  const el = document.getElementById('quizTimer');
  if (el && quizStartTime) {
    el.textContent = formatTime(Date.now() - quizStartTime);
  }
}

function showScoreScreen() {
  clearInterval(quizTimerInterval);
  const elapsed = quizStartTime ? Date.now() - quizStartTime : 0;
  const pct = Math.round((quizScore / quizTotal) * 100);

  let gradeEmoji, gradeText, gradeColor;
  if (pct === 100)      { gradeEmoji = '🏆'; gradeText = 'Perfect!';        gradeColor = '#F0C060'; }
  else if (pct >= 85)   { gradeEmoji = '🌟'; gradeText = 'Excellent';       gradeColor = '#8ADA6A'; }
  else if (pct >= 70)   { gradeEmoji = '👍'; gradeText = 'Good work';       gradeColor = '#6AAADA'; }
  else if (pct >= 50)   { gradeEmoji = '📖'; gradeText = 'Keep studying';   gradeColor = '#DAB06A'; }
  else                  { gradeEmoji = '🎸'; gradeText = 'Keep practicing'; gradeColor = '#DA7A6A'; }

  const overlay = document.getElementById('scoreOverlay');
  overlay.innerHTML = `
    <div style="background:#1E1810;border:1px solid #4A3A20;border-radius:8px;padding:40px 36px;text-align:center;max-width:360px;width:90%;font-family:'DM Sans',sans-serif;">
      <div style="font-size:0.7rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:20px;font-weight:600;">Quiz Complete · Key of ${currentKey}</div>

      <div style="font-family:'Lora',serif;font-size:5.5rem;font-weight:700;color:var(--gold);line-height:1;">${quizScore}<span style="font-size:2rem;color:#6A5A3A;">/${quizTotal}</span></div>

      <div style="margin:16px 0 6px;">
        <span style="font-size:1.8rem;">${gradeEmoji}</span>
        <span style="display:block;font-size:1.3rem;font-weight:600;color:${gradeColor};margin-top:6px;">${gradeText}</span>
      </div>

      <div style="font-size:1rem;color:#C8B88A;margin-bottom:6px;font-weight:500;">${pct}% correct</div>
      <div style="font-size:0.85rem;color:#7A6A4A;margin-bottom:28px;">⏱ Finished in ${formatTime(elapsed)}</div>

      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <button class="key-btn" onclick="retryQuiz()" style="padding:10px 24px;font-size:0.9rem;border-color:var(--gold);color:var(--gold);font-weight:600;">↺ Retry</button>
        <button class="key-btn" onclick="retryQuiz(true)" style="padding:10px 24px;font-size:0.9rem;color:#C8B88A;font-weight:600;">New Key</button>
      </div>
    </div>
  `;
  overlay.style.display = 'flex';
}

function retryQuiz(newKey) {
  document.getElementById('scoreOverlay').style.display = 'none';
  if (newKey) randomKey();
  else setMode('quiz');
}

// ── Card rendering ────────────────────────────────────────────
function renderCard() {
  const card = deck[currentIdx];
  const notes = getScaleNotes(currentKey);
  const chordNote = notes[parseInt(card.num) - 1];
  const qualityLabel = card.quality.includes('Minor') ? 'm' : card.quality.includes('Dim') ? '°' : '';
  const cardInner = document.getElementById('cardInner');
  cardInner.classList.toggle('flipped', isFlipped);

  // Play chord when card appears
  playChord(chordNote, card.quality);

  // ── FRONT ──
  const front = document.getElementById('cardFront');
  front.style.background = card.bgColor;
  front.style.color = card.color;

  if (mode === 'quiz') {
    // Alternate question type each card
    quizType = currentIdx % 2 === 0 ? 'letter' : 'number';

    if (quizType === 'letter') {
      // Show the number → guess the chord letter
      front.innerHTML = `
        <div class="card-accent-line" style="background:${card.accentColor}"></div>
        <div class="card-key-badge" style="color:${card.accentColor};opacity:1;">KEY OF ${currentKey}</div>
        <div style="font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:#E8DFC8;opacity:0.6;margin-bottom:16px;">What chord is the ${card.num}?</div>
        <div class="card-number-big" style="color:${card.accentColor};">${card.num}</div>
        <div class="card-number-name" style="color:#E8DFC8;opacity:0.9;">${card.name}</div>
        <div class="card-emoji">${card.emoji}</div>
        <div class="card-flip-hint" style="color:#E8DFC8;">press 1–4 to answer</div>
      `;
    } else {
      // Show the chord letter → guess the number
      front.innerHTML = `
        <div class="card-accent-line" style="background:${card.accentColor}"></div>
        <div class="card-key-badge" style="color:${card.accentColor};opacity:1;">KEY OF ${currentKey}</div>
        <div style="font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:#E8DFC8;opacity:0.6;margin-bottom:16px;">What number is ${chordNote}${qualityLabel}?</div>
        <div class="card-number-big" style="color:${card.accentColor};font-size:6rem;">${chordNote}${qualityLabel}</div>
        <div class="card-emoji">${card.emoji}</div>
        <div class="card-flip-hint" style="color:#E8DFC8;">press 1–4 to answer</div>
      `;
    }
  } else {
    front.innerHTML = `
      <div class="card-accent-line" style="background:${card.accentColor}"></div>
      <div class="card-key-badge" style="color:${card.accentColor};opacity:1;">KEY OF ${currentKey}</div>
      <div class="card-number-big" style="color:${card.accentColor};">${card.num}</div>
      <div class="card-number-name" style="color:#E8DFC8;opacity:0.9;">${card.name}</div>
      <div class="card-emoji">${card.emoji}</div>
      <div class="card-feeling" style="color:#E8DFC8;opacity:0.85;">${card.feeling}</div>
      <div class="card-flip-hint" style="color:#E8DFC8;">tap to reveal</div>
    `;
  }

  // ── BACK ──
  const back = document.getElementById('cardBack');
  back.style.background = '#110E08';
  back.style.color = '#E8DFC8';
  back.innerHTML = `
    <div class="card-accent-line" style="background:${card.accentColor}"></div>
    <div class="back-header">
      <div>
        <div class="back-number-small" style="color:${card.color}">${card.num}</div>
        <div class="back-chord-name">${card.name}</div>
      </div>
      <div class="back-key-chord">
        <div class="back-key-label">In Key of ${currentKey}</div>
        <div class="back-chord" style="color:${card.color}">${chordNote}${qualityLabel}</div>
      </div>
    </div>
    <div class="back-section">
      <div class="back-section-label">Scale Degree & Quality</div>
      <div class="back-section-content">${card.roman} — ${card.quality}</div>
    </div>
    <div class="back-section">
      <div class="back-section-label">Solfege</div>
      <div class="back-section-content" style="font-family:'Lora',serif;font-style:italic;font-size:1rem;color:${card.accentColor};">${card.solfege}</div>
    </div>
    <div class="back-section">
      <div class="back-section-label">Function</div>
      <div class="back-section-content">${card.function}</div>
    </div>
    <div class="back-section">
      <div class="back-section-label">Feel</div>
      <div class="back-section-content">${card.description}</div>
    </div>
    <div class="back-section">
      <div class="back-section-label">In Practice</div>
      <div class="song-examples">${card.songs}</div>
    </div>
  `;

  renderDots();
  renderCount();
}

function renderDots() {
  const dots = document.getElementById('progressDots');
  dots.innerHTML = '';
  deck.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentIdx ? ' active' : visited.has(i) && i !== currentIdx ? ' visited' : '');
    d.onclick = () => { currentIdx = i; visited.add(i); isFlipped = false; quizAnswered = false; renderCard(); renderQuizBtns(); };
    dots.appendChild(d);
  });
}

function renderCount() {
  document.getElementById('progressCount').textContent = `${currentIdx + 1} / ${deck.length}`;
}

// ── Navigation ────────────────────────────────────────────────
function flipCard(e) {
  if (e) { e.preventDefault(); e.stopPropagation(); }
  if (mode === 'quiz') {
    if (quizAnswered) nextCard();
    return;
  }
  isFlipped = !isFlipped;
  document.getElementById('cardInner').classList.toggle('flipped', isFlipped);
  document.getElementById('cardContainer').blur();
  // Play chord on flip to back (reveal)
  if (isFlipped) {
    const card = deck[currentIdx];
    const notes = getScaleNotes(currentKey);
    const chordNote = notes[parseInt(card.num) - 1];
    playChord(chordNote, card.quality);
  }
}

function nextCard() {
  // In quiz mode, show score after last card
  if (mode === 'quiz' && currentIdx === deck.length - 1 && quizAnswered) {
    showScoreScreen();
    return;
  }
  isFlipped = false;
  quizAnswered = false;
  currentIdx = (currentIdx + 1) % deck.length;
  if (mode === 'shuffle' && currentIdx === 0) {
    deck = [...NUMBERS].sort(() => Math.random() - 0.5);
  }
  visited.add(currentIdx);
  renderCard();       // sets quizType based on currentIdx
  renderQuizBtns();   // uses quizType to build correct buttons
  animateCard();
}

function prevCard() {
  isFlipped = false;
  quizAnswered = false;
  currentIdx = (currentIdx - 1 + deck.length) % deck.length;
  visited.add(currentIdx);
  renderCard();
  renderQuizBtns();
  animateCard();
}

function animateCard() {
  const c = document.getElementById('cardContainer');
  c.style.animation = 'none';
  requestAnimationFrame(() => { c.style.animation = 'cardIn 0.35s ease'; });
}

document.addEventListener('keydown', e => {
  if (mode === 'quiz') {
    // 1–4 select quiz answer
    if (['1','2','3','4'].includes(e.key) && !quizAnswered) {
      const idx = parseInt(e.key) - 1;
      if (quizChoices[idx]) submitQuizAnswer(quizChoices[idx].num);
      return;
    }
    // Space or right arrow advances after answering
    if ((e.key === ' ' || e.key === 'ArrowRight') && quizAnswered) {
      e.preventDefault();
      nextCard();
      return;
    }
    e.key === ' ' && e.preventDefault(); // block space before answering
  } else {
    if (e.key === 'ArrowRight') nextCard();
    if (e.key === 'ArrowLeft') prevCard();
    if (e.key === ' ') { e.preventDefault(); flipCard(e); }
  }
});

function randomKey() {
  const others = KEYS.filter(k => k !== currentKey);
  const picked = others[Math.floor(Math.random() * others.length)];
  currentKey = picked;
  document.querySelectorAll('.key-btn').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.key-btn').forEach(b => {
    if (b.textContent === picked) b.classList.add('active');
  });
  isFlipped = false;
  quizAnswered = false;
  renderCard();
  renderQuizBtns();
}

// ── Audio Engine ──────────────────────────────────────────────
let soundEnabled = false;
let masterVolume = 0.75;
let audioCtx = null;
const noteBuffers = {}; // 'A4' -> AudioBuffer
let samplesReady = false;

const SEMITONES = { 'C':0,'C#/Db':1,'D':2,'Eb':3,'E':4,'F':5,'F#/Gb':6,'G':7,'Ab':8,'A':9,'Bb':10,'B':11 };

// Semitone value of a sample file name like "A4", "Ds3", "Fs5"
function sampleToSemitone(name) {
  const noteMap = { 'A':9,'As':10,'Bb':10,'B':11,'C':0,'Cs':1,'D':2,'Ds':3,'Eb':3,'E':4,'F':5,'Fs':6,'G':7,'Ab':8 };
  const m = name.match(/^([A-Ga-g][sb]?)(\d+)$/);
  if (!m) return 0;
  const note = m[1].charAt(0).toUpperCase() + m[1].slice(1);
  return (parseInt(m[2]) + 1) * 12 + (noteMap[note] ?? 0);
}

function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

async function loadAllSamples() {
  const ctx = getCtx();
  const btn = document.getElementById('soundToggle');
  btn.textContent = '⏳ Loading...';

  const sampleNames = [
    'A1','A2','A3','A4','A5','A6','A7',
    'C1','C2','C3','C4','C5','C6','C7','C8',
    'Ds1','Ds2','Ds3','Ds4','Ds5','Ds6','Ds7',
    'Fs1','Fs2','Fs3','Fs4','Fs5','Fs6','Fs7'
  ];

  try {
    const results = await Promise.allSettled(sampleNames.map(async name => {
      const resp = await fetch(`/soundfonts/MusyngKite/acoustic_grand_piano-mp3/${name}.mp3`);
      if (!resp.ok) throw new Error(`Missing: ${name}.mp3`);
      const arrayBuf = await resp.arrayBuffer();
      await new Promise((resolve, reject) => {
        ctx.decodeAudioData(arrayBuf,
          (decoded) => { noteBuffers[name] = decoded; resolve(); },
          (err) => reject(new Error(`Decode failed for ${name}`))
        );
      });
    }));

    const loaded = results.filter(r => r.status === 'fulfilled').length;
    const failed = results.filter(r => r.status === 'rejected');
    if (failed.length > 0) console.warn(`${failed.length} samples failed:`, failed.map(f => f.reason?.message));

    if (loaded === 0) throw new Error('No samples loaded successfully');
    samplesReady = true;
    btn.textContent = '🔊 Sound';
    console.log(`Loaded ${loaded}/${sampleNames.length} piano samples`);
  } catch(e) {
    console.error(e);
    btn.textContent = '❌ Failed';
    alert('Could not load piano samples: ' + e.message);
    soundEnabled = false;
    document.getElementById('soundControls').style.display = 'none';
  }
}

// Find the closest loaded sample to a target semitone value
function findClosest(targetSemitone) {
  let bestName = null, bestDist = Infinity;
  for (const name of Object.keys(noteBuffers)) {
    const dist = Math.abs(sampleToSemitone(name) - targetSemitone);
    if (dist < bestDist) { bestDist = dist; bestName = name; }
  }
  return bestName;
}

function playNote(targetSemitone, when, vol, duration) {
  const ctx = getCtx();
  const closest = findClosest(targetSemitone);
  if (!closest) return;
  const shift = targetSemitone - sampleToSemitone(closest);
  const src = ctx.createBufferSource();
  src.buffer = noteBuffers[closest];
  src.playbackRate.value = Math.pow(2, shift / 12);
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(vol, when);
  gain.gain.setValueAtTime(vol, when + duration * 0.75);
  gain.gain.linearRampToValueAtTime(0, when + duration);
  src.connect(gain);
  gain.connect(ctx.destination);
  src.start(when);
  src.stop(when + duration + 0.05);
}

function playChord(rootName, quality) {
  if (!soundEnabled || !samplesReady) return;
  const ctx = getCtx();
  if (ctx.state === 'suspended') ctx.resume();

  // 1-3-5 intervals in semitones
  let intervals;
  if (quality.includes('Minor'))    intervals = [0, 3, 7];  // minor triad
  else if (quality.includes('Dim')) intervals = [0, 3, 6];  // diminished triad
  else                              intervals = [0, 4, 7];  // major triad

  const rootSt = SEMITONES[rootName] ?? 0;
  // Start at octave 3 (C3 = semitone 48) so it sits in a nice mid-range
  const baseOctave = 3;
  const baseSt = (baseOctave + 1) * 12 + rootSt;
  const now = ctx.currentTime + 0.03;
  const duration = 3.0;

  intervals.forEach(interval => {
    const targetSt = baseSt + interval;
    playNote(targetSt, now, masterVolume * 0.82, duration);
  });
}

function toggleSound() {
  soundEnabled = !soundEnabled;
  const btn = document.getElementById('soundToggle');
  btn.style.borderColor = soundEnabled ? 'var(--gold)' : '#3A3020';
  btn.style.color       = soundEnabled ? 'var(--gold)' : '';
  document.getElementById('soundControls').style.display = soundEnabled ? 'flex' : 'none';
  if (soundEnabled) {
    if (!samplesReady) loadAllSamples();
    else btn.textContent = '🔊 Sound';
  } else {
    btn.textContent = '🔇 Sound';
  }
}

function setVolume(val) {
  masterVolume = parseFloat(val);
  document.getElementById('volLabel').textContent = Math.round(masterVolume * 100) + '%';
}

// ── Boot ──────────────────────────────────────────────────────
initKeyBtns();
document.getElementById('modeDesc').textContent = MODE_INFO['study'];
renderCard();
</script>
